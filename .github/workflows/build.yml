name: Build Typing Master Pro (C#)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: कोड को चेकआउट करें
      uses: actions/checkout@v4

    - name: .NET 8 सेटअप करें
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: .exe फ़ाइल बनाएँ (Publish)
      run: dotnet publish -c Release -r win-x86 --self-contained true -p:PublishSingleFile=true -o ./output

    - name: सॉफ़्टवेयर अपलोड करें (Download Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: Krishna-Typing-Master-EXE
        path: ./output/KrishnaTypingMaster.exe

